# Deploys the repository root to GitHub Pages on every push to main. No path filters: the
# marathon remote's ci waits for this push run on each merge commit. Pull requests run nothing.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued deploy waits rather than cancelling the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      # The root, without .git, .github, and other dotfiles.
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
