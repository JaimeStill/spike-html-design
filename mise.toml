[tools]
actionlint = "1.7.12"
biome = "2.5.15"
bun = "1.4.3"
jq = "1.8.2"
shellcheck = "0.11.0"

[tasks.check]
description = "Lint and format-check the CSS, JS, scripts, and workflows, run the tests in headless chromium, and report each CSS and JS entry's size, failing when one is over its brotli budget; writes nothing"
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
command -v chromium >/dev/null || { echo "check: chromium not found"; exit 1; }
biome ci --no-errors-on-unmatched .
shellcheck scripts/*.sh
if [ -d .github/workflows ]; then actionlint; fi
bun test --pass-with-no-tests
bun scripts/size.js
'''

[tasks.currency]
description = "Report every mise tool and workflow action pin behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.pin]
description = "Check a published tag live: jsDelivr serves every stylesheet file it publishes immutable and byte-equal, and its pinned page renders the same from file://, a local server, and GitHub Pages; reads the network, writes nothing"
usage = 'arg "<tag>" help="The published tag to check, as in v0.1.0"'
run = 'bun "$MISE_PROJECT_ROOT/scripts/pin.js" "$usage_tag"'

[tasks.size]
description = "Report each CSS and JS entry's files with their raw and brotli-11 sizes, the totals, and its brotli budget and headroom; fails when an entry is over budget, writes nothing"
run = 'bun "$MISE_PROJECT_ROOT/scripts/size.js"'

[tasks.serve]
description = "Serve the working tree on localhost under the Pages subpath, /spike-html-design/, and print its URL; runs until interrupted, writes nothing"
usage = 'flag "--port <port>" default="8000" help="The localhost port to serve on"'
run = 'bun "$MISE_PROJECT_ROOT/scripts/serve.js" "$usage_port"'
