<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>baseline fixture</title>
    <link rel="stylesheet" href="../../baseline.css" />
    <style>
      /* A rule appended to the baseline's tools layer, standing in for a tools class, and an app
         layer the page declares after the stylesheet. The app rules carry equal or lower
         specificity than the rules they must beat (these tools rules, the elements layer's body
         rule), and no !important. */
      @layer spike-html-design.tools {
        #specific.probe,
        .probe {
          color: rgb(255, 0, 0);
        }
      }

      @layer app {
        .probe {
          color: rgb(0, 128, 0);
        }

        body {
          background-color: rgb(0, 0, 255);
        }
      }
    </style>
  </head>
  <body>
    <p class="probe" id="equal">equal specificity</p>
    <p class="probe" id="specific">higher specificity</p>
    <img alt="" />
    <picture></picture>
    <video><track kind="captions" /></video>
    <canvas></canvas>
    <svg aria-hidden="true"></svg>
    <button type="button">button</button>
    <input />
    <select>
      <option>option</option>
    </select>
    <textarea></textarea>
    <p id="target">target</p>
  </body>
</html>
