<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lean preferences fixture</title>
    <link rel="stylesheet" href="../../baseline.css" />
    <script type="module" blocking="render" src="../../modules/register.js"></script>
    <script type="module" blocking="render" src="../../modules/preferences.js"></script>
    <script type="module" src="../../modules/keys.js"></script>
  </head>
  <body>
    <h1>lean preferences fixture</h1>
    <p>A lean-entry page: a stored profile it hasn't registered falls back to that facet's default here, and stays in storage.</p>
    <p><button type="button" commandfor="theme" command="--open" data-keys="t">Theme <kbd>T</kbd></button></p>
    <p><label>Text <input type="text" /></label></p>
    <p><label>Notes <textarea></textarea></label></p>
    <p><label>Pick <select><option>one</option><option>two</option></select></label></p>
    <p contenteditable="true">Editable text.</p>
    <theme-menu id="theme"></theme-menu>
  </body>
</html>
